<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Learn Lusia fast: guide, API, playground, error codes."
    />
    <meta property="og:title" content="Lusia" />
    <meta
      property="og:description"
      content="Learn Lusia fast: guide, API, playground, error codes."
    />
    <meta property="og:image" content="https://lusia.azpepoze.com/logo-512.png" />
    <title>Lusia</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./public/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <style>
      /* First paint only: main.ts swaps this for the Loader component. Keep the colors in sync with _theme.scss. */
      html {
        scrollbar-gutter: stable;
      }
      html.is-loading {
        overflow: hidden;
      }
      html.is-loading .site-footer {
        display: none;
      }
      .loader-static {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #fdfaff;
        color: #3a2e4a;
        font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
      }
      html[data-theme="dark"] .loader-static {
        background: #0b0b0b;
        color: #f2f2f2;
      }
      .loader-static .loader-inner {
        display: grid;
        justify-items: center;
        gap: 0.9rem;
      }
      .loader-static .logo {
        width: 64px;
        height: 64px;
      }
      .loader-static .name {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 800;
      }
      .loader-static .dots {
        display: flex;
        gap: 0.45rem;
      }
      .loader-static .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        animation: loader-dot 500ms ease-in-out infinite alternate;
      }
      .loader-static .dot:nth-child(2) {
        animation-delay: 120ms;
      }
      .loader-static .dot:nth-child(3) {
        animation-delay: 240ms;
      }
      .loader-static .dot:nth-child(1) {
        background: #ffb7d5;
      }
      .loader-static .dot:nth-child(2) {
        background: #c9b6ff;
      }
      .loader-static .dot:nth-child(3) {
        background: #aef0d8;
      }
      html[data-theme="dark"] .loader-static .dot:nth-child(1) {
        background: #ff8fc7;
      }
      html[data-theme="dark"] .loader-static .dot:nth-child(2) {
        background: #b9a4ff;
      }
      html[data-theme="dark"] .loader-static .dot:nth-child(3) {
        background: #7ef0c8;
      }
      @keyframes loader-dot {
        to {
          transform: translateY(-8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-static * {
          animation: none !important;
        }
      }
    </style>
    <script>
      // Runs before first paint: sets the theme, marks JS as on and locks the page scroll until the app is ready.
      document.documentElement.classList.add("js", "is-loading");
      var stored = null;
      try {
        stored = localStorage.getItem("lusia-web-theme");
      } catch (error) {}
      var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="loader" class="loader-static" role="status" aria-label="Loading Lusia">
      <div class="loader-inner">
        <img class="logo" src="./public/logo.svg" width="64" height="64" alt="" />
        <p class="name">Lusia</p>
        <div class="dots" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

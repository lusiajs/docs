<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Lusia: a Bun-native UI framework with single-file components, variables and scoped SCSS."
    />
    <title>Lusia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <style>
      /* First paint only: main.ts swaps this for the Loader component. Keep the colors in sync with _theme.scss. */
      html {
        scrollbar-gutter: stable;
      }
      html.is-loading {
        overflow: hidden;
      }
      html.is-loading .site-footer {
        display: none;
      }
      .loader-static {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #fdfaff;
        color: #3a2e4a;
        font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
      }
      html[data-theme="dark"] .loader-static {
        background: #0b0b0b;
        color: #f2f2f2;
      }
      .loader-static .loader-inner {
        display: grid;
        justify-items: center;
        gap: 0.9rem;
      }
      .loader-static .name {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 800;
      }
      .loader-static .dots {
        display: flex;
        gap: 0.45rem;
      }
      .loader-static .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        animation: loader-dot 500ms ease-in-out infinite alternate;
      }
      .loader-static .dot:nth-child(2) {
        animation-delay: 120ms;
      }
      .loader-static .dot:nth-child(3) {
        animation-delay: 240ms;
      }
      .loader-static .dot:nth-child(1) {
        background: #ffb7d5;
      }
      .loader-static .dot:nth-child(2) {
        background: #c9b6ff;
      }
      .loader-static .dot:nth-child(3) {
        background: #aef0d8;
      }
      html[data-theme="dark"] .loader-static .dot:nth-child(1) {
        background: #ff8fc7;
      }
      html[data-theme="dark"] .loader-static .dot:nth-child(2) {
        background: #b9a4ff;
      }
      html[data-theme="dark"] .loader-static .dot:nth-child(3) {
        background: #7ef0c8;
      }
      @keyframes loader-dot {
        to {
          transform: translateY(-8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-static * {
          animation: none !important;
        }
      }
    </style>
    <script>
      // Runs before first paint: sets the theme, marks JS as on and locks the page scroll until the app is ready.
      document.documentElement.classList.add("js", "is-loading");
      var stored = null;
      try {
        stored = localStorage.getItem("lusia-web-theme");
      } catch (error) {}
      var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="loader" class="loader-static" role="status" aria-label="Loading Lusia">
      <div class="loader-inner">
        <p class="name">Lusia</p>
        <div class="dots" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </div>
    <p class="status-strip" role="note">
      Preview — Lusia is under active development and has no release yet.
      <a href="https://github.com/AzPepoze/lusia">Follow progress on GitHub</a>
    </p>
    <header class="topbar">
      <button
        class="icon-button menu-button"
        id="menu"
        type="button"
        aria-label="Open the docs menu"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <span class="material-symbols-rounded" aria-hidden="true">menu</span>
      </button>
      <a class="brand" href="/">Lusia</a>
      <nav class="main-menu" aria-label="Main">
        <a href="/">Home</a>
        <a href="/guide">Guide</a>
        <a href="/reference">Reference</a>
        <a href="/playground">Playground</a>
      </nav>
      <div id="search-slot"></div>
      <div class="topbar-actions">
        <div id="theme-slot"></div>
        <a
          class="icon-button"
          href="https://github.com/AzPepoze/lusia"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Lusia on GitHub"
        >
          <svg class="github-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91
                .58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36
                -3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7
                1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75
                .4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28
                1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9
                10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23
                2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25
                5.67.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .3.2.67
                .8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
              fill="currentColor"
            />
          </svg>
        </a>
      </div>
    </header>

    <div id="outlet"></div>

    <footer class="site-footer">
      <p class="footer-brand">Lusia</p>
      <nav aria-label="Footer">
        <a href="/">Home</a>
        <a href="/guide">Guide</a>
        <a href="/reference">Reference</a>
        <a href="/playground">Playground</a>
        <a href="https://github.com/AzPepoze/lusia" target="_blank" rel="noopener noreferrer"
          >GitHub</a
        >
      </nav>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
